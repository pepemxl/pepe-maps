services:
  app:
    build: .
    image: pepe-maps-dev
    container_name: pepe-maps-app
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: pepe_maps
      DB_USER: pepe
      DB_PASS: pepe
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: pepe-maps-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: pepe_maps
      MYSQL_USER: pepe
      MYSQL_PASSWORD: pepe
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
